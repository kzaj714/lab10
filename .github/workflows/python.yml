```yaml
name: NIP Rent

"on":
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    name: Test and deploy documentation
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install UV
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version-file: .python-version

      - name: Install the project
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest tests -v

      - name: Run linter for src
        run: uv run ruff check src --exit-zero

      - name: Run linter for main_demo.py
        run: uv run ruff check main_demo.py --exit-zero

      - name: Generate Docs
        run: uv run pdoc src -o ./docs-output

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
```
